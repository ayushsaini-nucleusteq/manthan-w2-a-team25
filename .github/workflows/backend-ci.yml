# Backend CI: tests (unit + Testcontainers integration), Prometheus alert-rule tests, a dependency check on pull
# requests, and a guard that no .env file is committed. GitHub-hosted Ubuntu runners have Docker, which
# Testcontainers and promtool need.
name: backend-ci

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed (.env must never be tracked)
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$tracked" ]; then echo "Tracked .env file(s): $tracked"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit and integration tests
        run: ./backend/mvnw -B -f backend verify

      - name: Prometheus config and alert-rule tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules alert-rules.test.yml

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  dependency-check:
    # Fails a pull request that adds or upgrades a dependency with a known vulnerability of high severity or worse.
    # Needs the repository's dependency graph enabled (Settings > Code security).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
