      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
              examples:
                draft: { $ref: '#/components/examples/ClaimDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Claims]
      operationId: deleteClaim
      summary: Delete a never-submitted draft
      description: "**Roles:** owner. `DRAFT` with `submissionNo = 0` only (409 otherwise). A `CLAIM_DELETED` audit event is kept."
      x-roles: [EMPLOYEE]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{claimId}/lines:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [Claims]
      operationId: addLine
      summary: Add a line item
      description: |
        **Roles:** owner; claim in `DRAFT` or `SENT_BACK` (409 otherwise; also 409 above 50 lines).
        400 (US1-AC1): missing category, amount, expenseDate or vendor; `expenseDate` in the future; amount
        <= 0 or too large; unknown category; `HOTEL` without `city`/`nights` or a non-hotel line with them.
        **Idempotent with a client `id`** (US3-AC3): a line `id` already on this claim with the same content
        returns the claim unchanged with **200**; the same `id` with different content, or used on another
        claim, returns 409.
      x-roles: [EMPLOYEE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseLineCreateRequest' }
