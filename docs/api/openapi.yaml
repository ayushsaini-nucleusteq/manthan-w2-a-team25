openapi: 3.1.0
info:
  title: ExpenseFlow API
  version: 0.3.0
  summary: Expense claims, versioned policy checks, approval chain, sample audits, payouts, notifications and audit trail.
  description: |
    ExpenseFlow (Track A) REST API.
    Sources: `docs/requirements/track-a-usecase.md`, `docs/requirements/screen-list.md`,
    `docs/requirements/ExpenseFlow_Stories_and_Acceptance_Criteria.xlsx`.
    Screen-to-endpoint mapping: `docs/api/screen-map.md`. AC coverage: `docs/api/ac-traceability.md`.
    Tables and the claim state machine: `docs/data-model.md`.

    ## Conventions
    - Base path `/api`. Everything except `POST /api/auth/login` needs `Authorization: Bearer <JWT>`.
      Tokens last 8 hours; there is no refresh token (sign in again). Sign-in is email + password
      (BCrypt hashes); there is no public user list.
    - Roles: `EMPLOYEE`, `MANAGER`, `AUDITOR`, `FINANCE_HEAD` (also admin). Every user holds `EMPLOYEE`
      and can file claims. Allowed roles are in each operation's description and its `x-roles` field;
      `ANY` = any signed-in user.
    - Access is checked on the server. **404** = the resource does not exist *or* the caller may not see
      it (e.g. someone else's claim). **403** = the caller's role may not use the operation, or the caller
      can see the claim but may not do this to it (e.g. act on their own claim).
    - **422** is used only by submit, when the claim cannot be submitted as it stands (e.g. a receipt is
      missing above the threshold); the error lists every problem per line in `errors`.
    - Nobody acts on their own claim. A step whose approver would be the owner goes to another user with
      that role.
    - Money is INR as a decimal **string** with two decimals (`"1500.00"`), matching `NUMERIC(12,2)`.
    - Timestamps are ISO-8601 UTC. Business dates (expense, trip, delegation, dashboard ranges) are
      ISO dates in Asia/Kolkata.
    - Lists are paginated: `page` (0-based), `size` (default 20, max 100), `sort` (`field,asc|desc`).
      Pages carry `items`, `page`, `size`, `totalItems`, `totalPages`. Small reference lists
      (departments, categories) are plain arrays.
    - One error shape, `ApiError`, for every non-2xx response; `requestId` equals the `X-Request-Id` header.
    - Optimistic locking: state-changing requests on claims, users, policy and batches send the `version`
      they read; a stale one returns 409.
    - Offline sync (US3-AC3): `POST /api/claims` and `POST /api/claims/{id}/lines` accept a client-generated
      UUID `id`. The same `id` with the same content returns the existing record with 200 and changes
      nothing; the same `id` with different content returns 409.
    - The UI shows both 403 and 404 as "not found" (screen-list UI states).
    - Claims carry a human-readable, unique `claimNumber`: `CL-` + a zero-padded sequence (`CL-000123`).
      Every claim response returns it, and claim lists accept `q` to search it (and the title).

    ## Known limitations
    - **Logout is client-side.** `POST /api/auth/logout` records the event; the client discards the token,
      which stays valid until it expires (no server-side revocation list in this version).
    - **No sign-in throttling** yet: failed logins are audited but not rate-limited.
servers:
  - url: http://localhost:8080
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Notifications
  - name: Users
  - name: Reference data
  - name: Policy
    description: Versioned policy configuration.
  - name: Delegations
  - name: Claims
  - name: Approvals
  - name: Auditor
  - name: Payouts
  - name: Dashboard
  - name: Audit trail

paths:
  # ================================================================== Auth (S1)
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password; returns an 8-hour JWT
      description: |
        **Roles:** public. Email (case-insensitive) + password, checked against a BCrypt hash.
        Unknown email, wrong password and inactive user all return **401** with the same message,
        "Email or password is incorrect", so the response never reveals which accounts exist.
        "Role switch" (wireframes v4) happens inside one account: the frontend switches screens between the roles in the JWT; it does not change the account. The JWT carries **all** of the user's
        roles; there is no active-role selection. Every success writes a `LOGIN` audit event and every
        failure a `LOGIN_FAILED` event (attempted email in `details`, never the password).
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: asha.verma@expenseflow.test, password: "<password>" }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMTkzNWYyYS0xYzAwLTcwMDAtODAwMC0wMDAwMDAwMDAxMDEifQ.sig
                tokenType: Bearer
                expiresIn: 28800
                user:
                  id: 01935f2a-1c00-7000-8000-000000000101
                  fullName: Asha Verma
                  email: asha.verma@expenseflow.test
                  employeeCode: E1001
                  roles: [EMPLOYEE]
                  department: { id: 01935f2a-1c00-7000-8000-000000000201, code: ENG, name: Engineering }
                  manager: { id: 01935f2a-1c00-7000-8000-000000000102, fullName: Ravi Kumar }
                  homeScreen: E1
                  delegationsReceived: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password (same message for both), or inactive user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { timestamp: "2026-11-27T09:00:00Z", status: 401, error: Unauthorized, message: Email or password is incorrect, path: /api/auth/login, requestId: 6f1c2a9e-4b7d-4c1e-9a55-2f0d8c3b7e16 }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out (audited)
      description: |
        **Roles:** ANY. Writes a `LOGOUT` audit event and returns 204. The client discards the token;
        the server does not revoke it (see Known limitations).
      x-roles: [ANY]
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user, roles and home screen
      description: |
        **Roles:** ANY. `roles` lists every role the user holds (same as the JWT). `homeScreen` is the
        landing screen for the highest role held: FINANCE_HEAD -> `F1`, AUDITOR -> `A1`, MANAGER -> `M1`,
        otherwise `E1`.
      x-roles: [ANY]
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
              examples:
                manager: { $ref: '#/components/examples/CurrentUserManager' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================== Notifications (S2)
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: My notifications, newest first
      description: "**Roles:** ANY (own notifications only)."
      x-roles: [ANY]
      parameters:
        - name: unread
          in: query
          description: true = unread only.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
              example:
                items:
                  - { id: 01935f2a-1c00-7000-8000-000000000901, type: APPROVAL_WAITING, title: Claim waiting for your approval, message: "CL-000123 from Asha Verma, 14050.00 INR", claimId: 01935f2a-1c00-7000-8000-000000000301, claimNumber: CL-000123, payoutBatchId: null, read: false, readAt: null, createdAt: "2026-11-20T09:15:02Z" }
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Badge count
      description: "**Roles:** ANY."
      x-roles: [ANY]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
              example: { unread: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification read (idempotent)
      description: "**Roles:** ANY; recipient only (others get 404)."
      x-roles: [ANY]
      responses:
        '200':
          description: The notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
              example: { id: 01935f2a-1c00-7000-8000-000000000901, type: APPROVAL_WAITING, title: Claim waiting for your approval, message: "CL-000123 from Asha Verma, 14050.00 INR", claimId: 01935f2a-1c00-7000-8000-000000000301, claimNumber: CL-000123, payoutBatchId: null, read: true, readAt: "2026-11-20T10:00:00Z", createdAt: "2026-11-20T09:15:02Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all my notifications read
      description: "**Roles:** ANY."
      x-roles: [ANY]
      responses:
        '200':
          description: How many changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadAllResult' }
              example: { updated: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================== Users (F5)
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users with manager, roles and active flag
      description: |
        **Roles:** MANAGER, AUDITOR, FINANCE_HEAD. FINANCE_HEAD uses it for F5; approvers use it to pick a
        delegate (`role=` filter). Sort: `fullName` (default), `employeeCode`.
      x-roles: [MANAGER, AUDITOR, FINANCE_HEAD]
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: managerId
          in: query
          schema: { type: string, format: uuid }
        - name: active
          in: query
          description: Omit for all users.
          schema: { type: boolean }
        - name: q
          in: query
          description: Case-insensitive match on name, email or employee code.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
              example:
                items:
                  - { id: 01935f2a-1c00-7000-8000-000000000101, employeeCode: E1001, fullName: Asha Verma, email: asha.verma@expenseflow.test, roles: [EMPLOYEE], department: { id: 01935f2a-1c00-7000-8000-000000000201, code: ENG, name: Engineering }, manager: { id: 01935f2a-1c00-7000-8000-000000000102, fullName: Ravi Kumar }, active: true, version: 0 }
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Set manager, roles or active flag
      description: |
        **Roles:** FINANCE_HEAD. Only fields sent change; `EMPLOYEE` is always kept in `roles`.
        400: manager is the user themself, would create a reporting cycle, or is inactive.
        409: stale `version`; a FINANCE_HEAD removing their own FINANCE_HEAD role or deactivating
        themself; removing the last active FINANCE_HEAD or AUDITOR. Changing a manager does not move
        steps that are already pending. Audited as `USER_UPDATED`.
      x-roles: [FINANCE_HEAD]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
            example: { version: 0, managerId: 01935f2a-1c00-7000-8000-000000000106, roles: [EMPLOYEE, MANAGER] }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 01935f2a-1c00-7000-8000-000000000101, employeeCode: E1001, fullName: Asha Verma, email: asha.verma@expenseflow.test, roles: [EMPLOYEE, MANAGER], department: { id: 01935f2a-1c00-7000-8000-000000000201, code: ENG, name: Engineering }, manager: { id: 01935f2a-1c00-7000-8000-000000000106, fullName: Kiran Rao }, active: true, version: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================================================================== Reference data
  /api/departments:
    get:
      tags: [Reference data]
      operationId: listDepartments
      summary: List departments
      description: "**Roles:** ANY."
      x-roles: [ANY]
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
              example:
                - { id: 01935f2a-1c00-7000-8000-000000000201, code: ENG, name: Engineering }
                - { id: 01935f2a-1c00-7000-8000-000000000202, code: SALES, name: Sales }
                - { id: 01935f2a-1c00-7000-8000-000000000203, code: FIN, name: Finance }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/expense-categories:
    get:
      tags: [Reference data]
      operationId: listExpenseCategories
      summary: List expense categories
      description: |
        **Roles:** ANY. `coveredByPolicy` is computed from the current policy version; lines in an
        uncovered category are routed with the `NO_POLICY_RULE` flag.
      x-roles: [ANY]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExpenseCategory' }
              example:
                - { code: MEALS, name: Meals, requiresHotelDetails: false, coveredByPolicy: true }
                - { code: HOTEL, name: Hotel, requiresHotelDetails: true, coveredByPolicy: true }
                - { code: LOCAL_CAB, name: Local cab, requiresHotelDetails: false, coveredByPolicy: true }
                - { code: AIRFARE, name: Airfare, requiresHotelDetails: false, coveredByPolicy: false }
                - { code: OTHER, name: Other, requiresHotelDetails: false, coveredByPolicy: false }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================== Policy (F4)
  /api/policy/current:
    get:
      tags: [Policy]
      operationId: getCurrentPolicy
      summary: The policy version in force
      description: "**Roles:** ANY (employees see caps; E4 hints use it)."
      x-roles: [ANY]
      responses:
        '200':
          description: Current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
              examples:
                v1: { $ref: '#/components/examples/PolicyVersion1' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/policy/versions:
    get:
      tags: [Policy]
      operationId: listPolicyVersions
      summary: Version history, newest first
      description: "**Roles:** ANY."
      x-roles: [ANY]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of version summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersionSummaryPage' }
              example:
                items:
                  - { versionNo: 2, current: true, changeNote: Raise meals cap for Q4, createdBy: { id: 01935f2a-1c00-7000-8000-000000000104, fullName: Arjun Shah }, createdAt: "2026-11-25T06:00:00Z" }
                  - { versionNo: 1, current: false, changeNote: Initial seed, createdBy: null, createdAt: "2026-11-01T00:00:00Z" }
                page: 0
                size: 20
                totalItems: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Policy]
      operationId: createPolicyVersion
      summary: Publish a new policy version
      description: |
        **Roles:** FINANCE_HEAD. The body is the complete configuration (rules, tier-1 cities, receipt
        threshold, weekend rule, overdue threshold, chain thresholds); it becomes version N+1 and current
        immediately. Earlier versions are never changed. Claims already evaluated keep their version;
        later submits and resubmits use the new one.
        400: `hardLimit < softLimit`, duplicate rule code, unknown category, percent outside 0-100,
        `financeHeadAboveTotal < auditorAboveTotal`. 409: `basedOnVersionNo` is not the current version
        (someone published in between). Audited as `POLICY_VERSION_CREATED`.
      x-roles: [FINANCE_HEAD]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyVersionCreateRequest' }
            example:
              basedOnVersionNo: 1
              changeNote: Raise meals cap for Q4
              settings: { receiptThreshold: "500.00", weekendFlagEnabled: true, overdueThresholdHours: 48, autoApproveMaxTotal: "25000.00", auditorAboveTotal: "25000.00", financeHeadAboveTotal: "100000.00", sampleAuditPercent: 10 }
              rules:
                - { code: MEALS_DAILY, category: MEALS, unit: PER_DAY, cityTier: null, softLimit: "1800.00", hardLimit: "3600.00" }
                - { code: HOTEL_NIGHTLY_TIER1, category: HOTEL, unit: PER_NIGHT, cityTier: TIER1, softLimit: "6000.00", hardLimit: "12000.00" }
                - { code: HOTEL_NIGHTLY_OTHER, category: HOTEL, unit: PER_NIGHT, cityTier: OTHER, softLimit: "4000.00", hardLimit: "8000.00" }
                - { code: LOCAL_CAB_TRIP, category: LOCAL_CAB, unit: PER_TRIP, cityTier: null, softLimit: "2000.00", hardLimit: "4000.00" }
              tier1Cities: [Ahmedabad, Bengaluru, Chennai, Delhi, Hyderabad, Kolkata, Mumbai, Pune]
      responses:
        '201':
          description: New current version
          headers:
            Location: { schema: { type: string }, example: /api/policy/versions/2 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
              examples:
                v2: { $ref: '#/components/examples/PolicyVersion2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/policy/versions/{versionNo}:
    parameters:
      - name: versionNo
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Policy]
      operationId: getPolicyVersion
      summary: One policy version in full
      description: "**Roles:** ANY (claim detail links to the version a claim was checked against)."
      x-roles: [ANY]
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
              examples:
                v1: { $ref: '#/components/examples/PolicyVersion1' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================== Delegations
  /api/delegations:
    get:
      tags: [Delegations]
      operationId: listDelegations
      summary: Delegations I gave, I received, or all (FINANCE_HEAD)
      description: |
        **Roles:** MANAGER, AUDITOR, FINANCE_HEAD for `scope=given` (default) and `scope=received`;
        FINANCE_HEAD only for `scope=all` (403 otherwise). Sort: `startsOn` (default desc).
      x-roles: [MANAGER, AUDITOR, FINANCE_HEAD]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [given, received, all], default: given }
        - name: activeOn
          in: query
          description: Only non-revoked delegations whose range contains this date.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of delegations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPage' }
              example:
                items:
                  - { id: 01935f2a-1c00-7000-8000-000000000801, delegator: { id: 01935f2a-1c00-7000-8000-000000000102, fullName: Ravi Kumar }, delegate: { id: 01935f2a-1c00-7000-8000-000000000106, fullName: Kiran Rao }, roles: [MANAGER], startsOn: "2026-11-20", endsOn: "2026-11-30", reason: Annual leave, active: true, createdAt: "2026-11-19T07:30:00Z", revokedAt: null }
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Delegations]
      operationId: createDelegation
      summary: Delegate my approvals for a date range
      description: |
        **Roles:** MANAGER, AUDITOR, FINANCE_HEAD.
        While active (today within `[startsOn, endsOn]`, not revoked) the delegate sees and may act on steps
        assigned to the delegator, for the approver roles the delegator holds **and** the delegate also
        holds (returned as `roles`). The delegator can still act. No re-delegation: a delegate cannot pass
        delegated work on. Audit and inbox show `onBehalfOf`.
        400: delegate is self, `endsOn < startsOn`, `endsOn` in the past, or the delegate holds none of the
        delegator's approver roles. 404: delegate unknown or inactive. 409: overlaps another non-revoked
        delegation by the same delegator.
      x-roles: [MANAGER, AUDITOR, FINANCE_HEAD]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreateRequest' }
            example: { delegateId: 01935f2a-1c00-7000-8000-000000000106, startsOn: "2026-11-20", endsOn: "2026-11-30", reason: Annual leave }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
              example: { id: 01935f2a-1c00-7000-8000-000000000801, delegator: { id: 01935f2a-1c00-7000-8000-000000000102, fullName: Ravi Kumar }, delegate: { id: 01935f2a-1c00-7000-8000-000000000106, fullName: Kiran Rao }, roles: [MANAGER], startsOn: "2026-11-20", endsOn: "2026-11-30", reason: Annual leave, active: true, createdAt: "2026-11-19T07:30:00Z", revokedAt: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/delegations/{delegationId}:
    parameters:
      - name: delegationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Delegations]
      operationId: revokeDelegation
      summary: Revoke a delegation (soft)
      description: "**Roles:** the delegator, or FINANCE_HEAD. Sets `revokedAt`; the row stays. Already revoked or ended: 409."
      x-roles: [MANAGER, AUDITOR, FINANCE_HEAD]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================================================================== Claims (E1-E7)
  /api/claims:
    get:
      tags: [Claims]
      operationId: listClaims
      summary: List claims, with counts for the status chips
      description: |
        **Roles:** ANY for `scope=mine` (default, own claims). `scope=all` is AUDITOR or FINANCE_HEAD (403
        otherwise). `statusCounts` counts every status for the same scope and filters **except** `status`,
        so chips stay stable while one is selected; statuses with no claims appear with 0.
        Sort: `updatedAt` (default desc), `submittedAt`, `totalAmount`, `claimNumber`.
      x-roles: [ANY]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, all], default: mine }
        - name: status
          in: query
          description: Repeatable.
          schema:
            type: array
            items: { $ref: '#/components/schemas/ClaimStatus' }
          style: form
          explode: true
        - name: employeeId
          in: query
          description: "`scope=all` only."
          schema: { type: string, format: uuid }
        - name: departmentId
          in: query
          description: "`scope=all` only."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaimSearch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of claims plus status counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimListPage' }
              example:
                items:
                  - { id: 01935f2a-1c00-7000-8000-000000000301, claimNumber: CL-000123, title: Client visit - Mumbai, status: PENDING_MANAGER, employee: { id: 01935f2a-1c00-7000-8000-000000000101, fullName: Asha Verma }, department: { id: 01935f2a-1c00-7000-8000-000000000201, code: ENG, name: Engineering }, tripStartDate: "2026-11-16", tripEndDate: "2026-11-18", currency: INR, totalAmount: "14050.00", lineCount: 2, policyOutcome: ROUTE, flags: [SOFT_LIMIT_EXCEEDED], sampleAudit: false, sampleAuditStatus: null, sampleAuditedBy: null, sampleAuditedAt: null, submittedAt: "2026-11-20T09:15:02Z", decidedAt: null, updatedAt: "2026-11-20T09:15:02Z" }
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
                statusCounts: { DRAFT: 2, SUBMITTED: 0, AUTO_APPROVED: 3, AUTO_REJECTED: 1, PENDING_MANAGER: 1, PENDING_AUDITOR: 0, PENDING_FINANCE_HEAD: 0, SENT_BACK: 0, REJECTED: 0, APPROVED: 4, IN_BATCH: 1, PAID: 6 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Create a draft claim
      description: |
        **Roles:** ANY (everyone can file claims). Caller becomes the owner; status `DRAFT`.
        Lines may be included or added later. 400: `tripEndDate < tripStartDate`, or a line fails validation
        (future `expenseDate`, amount <= 0, bad category, hotel fields wrong).
        **Idempotent with a client `id`** (offline drafts, US3-AC3): if a claim with that `id` already exists,
        belongs to the caller and the request has the same content (header and any `lines`), it is returned
        unchanged with **200**. The same `id` with different content, or owned by someone else, returns 409.
      x-roles: [ANY]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimCreateRequest' }
            example:
              id: 01935f2a-1c00-7000-8000-000000000301
              title: Client visit - Mumbai
              purpose: On-site workshop with Acme Retail
              tripStartDate: "2026-11-16"
              tripEndDate: "2026-11-18"
              currency: INR
              lines:
                - { id: 01935f2a-1c00-7000-8000-000000000401, category: HOTEL, amount: "13200.00", expenseDate: "2026-11-17", vendor: Hotel Sea View, notes: 2 nights, city: Mumbai, nights: 2 }
                - { id: 01935f2a-1c00-7000-8000-000000000402, category: MEALS, amount: "850.00", expenseDate: "2026-11-17", vendor: Cafe Madras, notes: Dinner }
      responses:
        '200':
          description: Replay of an `id` the caller already created; existing claim returned unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
              examples:
                draft: { $ref: '#/components/examples/ClaimDraft' }
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, example: /api/claims/01935f2a-1c00-7000-8000-000000000301 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
              examples:
                draft: { $ref: '#/components/examples/ClaimDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{claimId}:
    parameters:
