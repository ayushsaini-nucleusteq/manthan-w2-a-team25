services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    # No host port on purpose: only services on this network can reach the DB.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # HS256 signing key, >= 32 bytes. Empty = random per start (tokens stop working after a restart).
      JWT_SECRET: ${JWT_SECRET:-}
      # Shared password of the seeded demo users (see docs/demo-accounts.md); real value only in .env.
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      RECEIPT_DIR: /data/receipts
    volumes:
      - receipts:/data/receipts
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      # Readiness = app ready to serve AND database reachable.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  # frontend:
  #   build: ./frontend
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:80"
  #   restart: unless-stopped
  #   # The browser origin it is served from must be listed in FRONTEND_ORIGIN (.env) for CORS.

  prometheus:
    image: prom/prometheus:v3.5.0
    # No depends_on the backend: Prometheus must keep running to report AppDown when the backend is down.
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/backend.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
  receipts:
