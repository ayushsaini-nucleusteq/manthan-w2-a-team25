spring.application.name=backend

# --- Database (values come from env / .env via docker compose) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:}
# Fail fast when the DB is unreachable (default is 30s): requests and the readiness check give up after 5s.
spring.datasource.hikari.connection-timeout=5000

# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations go in src/main/resources/db/migration as V1__<name>.sql, V2__..., etc.
# There are none yet: Flyway starts cleanly on an empty folder and applies V1 when it appears.
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=false

# --- CORS: comma-separated list of allowed browser origins ---
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# --- Logging: ECS JSON to stdout; MDC keys (requestId) become top-level fields ---
logging.structured.format.console=ecs

# --- Never leak internals from Spring Boot's fallback /error page ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Actuator: expose only health, info, prometheus ---
management.endpoints.access.default=none
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only

management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

management.info.env.enabled=true
info.app.name=${spring.application.name}

# --- Metrics ---
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
