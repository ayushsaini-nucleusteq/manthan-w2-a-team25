spring.application.name=backend

# --- Database (values come from env / .env via docker compose) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:}
# Fail fast when the DB is unreachable (default is 30s): requests and the readiness check give up after 5s.
spring.datasource.hikari.connection-timeout=5000

# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations: src/main/resources/db/migration (V1 schema, V2 reference data incl. policy version 1).
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=false
# Batch inserts (demo seeder) become multi-row INSERTs.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# --- Auth: HS256 JWT, 8h. JWT_SECRET must be >= 32 bytes; empty = random per start (tokens die on restart) ---
app.jwt.secret=${JWT_SECRET:}

# --- Receipts: files under RECEIPT_DIR (docker volume "receipts" at /data/receipts); 5 MB per file ---
app.receipts.dir=${RECEIPT_DIR:./data/receipts}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Demo data: seeded once into an empty database. Users sign in with SEED_USER_PASSWORD (set only in .env) ---
app.seed.enabled=${SEED_DEMO_DATA:true}
app.seed.user-password=${SEED_USER_PASSWORD:}
app.seed.claims=3000

# --- CORS: comma-separated list of allowed browser origins ---
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# --- Logging: ECS JSON to stdout; MDC keys (requestId) become top-level fields ---
logging.structured.format.console=ecs

# --- Never leak internals from Spring Boot's fallback /error page ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Actuator: expose only health, info, prometheus ---
management.endpoints.access.default=none
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only

management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

management.info.env.enabled=true
info.app.name=${spring.application.name}

# --- Metrics ---
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
