groups:
  - name: backend
    rules:
      - alert: AppDown
        expr: up{job="backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 30s."

      # Process answers scrapes but the readiness group (readinessState + db) is not UP,
      # e.g. the database is unreachable. AppDown does not fire in this case.
      - alert: ReadinessDown
        expr: app_readiness{job="backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Backend is running but not ready"
          description: "Readiness (readinessState, db) has been DOWN for 30s on {{ $labels.instance }}. Check the database."

      # 0-1 ratio, same as the Grafana "5xx error rate" panel; 0.05 = the 5% red line there.
      # With no traffic (or no 5xx series yet) this evaluates to nothing/NaN, so an idle app can't fire it.
      - alert: High5xxRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="backend", uri!~"/actuator.*", status=~"5.."}[1m]))
            /
            sum(rate(http_server_requests_seconds_count{job="backend", uri!~"/actuator.*"}[1m]))
          ) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last minute."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="backend", uri!~"/actuator.*"}[1m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 500ms"
          description: "p95 request latency is {{ $value | humanizeDuration }}."

      # US18: the oldest pending approval has waited longer than the configured threshold. The threshold is
      # NOT hard-coded here: the backend exports the policy's overdueThresholdHours as
      # expenseflow_approval_age_threshold_seconds (US18-AC1), so changing the policy (F4) moves the alert.
      # One breach = one alert: it goes pending, fires once after 5m, and stays firing (not re-fired on each
      # scrape or dashboard refresh) until the backlog clears; keep_firing_for stops flapping at the edge (US18-AC2).
      - alert: OldestPendingApprovalTooOld
        expr: |
          max(expenseflow_oldest_pending_approval_seconds{job="backend"})
            > max(expenseflow_approval_age_threshold_seconds{job="backend"})
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An approval has been pending longer than the configured threshold"
          description: "Oldest pending approval has waited {{ $value | humanizeDuration }}. See the 'Oldest pending approval age' panel and docs/runbook.md."
